<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finder</title>
    <link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col">
                <h1>IMG</h1>
            </div>
            <div class="col">
                <h1>Job Search</h1>
            </div>
            <div class="col">
                <h1>Career Advice</h1>
            </div>
            <div class="col">
                <h1>Notifications</h1>
            </div>
            <div class="col">
                <h1>News</h1>
            </div>
            <div class="column">
                <h1>Profile</h1>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <h1>X/X Job Posts</h1>
            </div>
            <div class="col">
                <h1>Search</h1>
            </div>
            <div class="col">
                <h1>Filters</h1>
            </div>
        </div>
        <div class="row">
            <div class="col container">
                <div class="row">
                    <div class="col container">
                        <div class="row">
                            <div class="col">
                                <h1>Job Title</h1>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <h1>Company name</h1>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <h1>Address</h1>
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <h1>Work Type</h1>
                    </div>
                    <div class="col">
                        <h1>Employment Type</h1>
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <h1>Salary Range</h1>
                    </div>
                    <div class="col">
                        <h1>Age Requirement</h1>
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <h1>Hours</h1>
                    </div>
                    <div class="col">
                        Skills
                    </div>
                </div>
                <div class="row">
                    <div class="row">
                        Summary
                    </div>
                </div>
                <div class="row">
                    <div class="row">
                        More Info
                    </div>
                </div>
            </div>
            <div class="col">
                <h1>Summary</h1>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <h1>Apply</h1>
            </div>
            <div class="col">
                <h1>Save</h1>
            </div>
            <div class="col">
                <h1>Hide</h1>
            </div>
        </div>
    </div>

    <script src="bootstrap-5.3.8-dist/js/bootstrap.min.js"></script>
</body>
</html>
