<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finder</title>
    <link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col bg-primary">
                <h4>IMG</h4>
            </div>
            <div class="col bg-secondary">
                <h4>Job Search</h4>
            </div>
            <div class="col bg-primary">
                <h4>Career Advice</h4>
            </div>
            <div class="col bg-secondary">
                <h4>Notifications</h4>
            </div>
            <div class="col bg-primary">
                <h4>News</h4>
            </div>
            <div class="col bg-secondary">
                <h4>Profile</h4>
            </div>
        </div>
        <div class="row">
            <div class="col bg-success">
                <h4>X/X Job Posts</h4>
            </div>
            <div class="col bg-danger">
                <h4>Search</h4>
            </div>
            <div class="col bg-success">
                <h4>Filters</h4>
            </div>
        </div>
        <div class="row">
            <div class="col container bg-info">
                <div class="row">
                    <div class="col container">
                        <div class="row">
                            <div class="col">
                                <h4>Job Title</h4>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <h4>Company name</h4>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <h4>Address</h4>
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <h4>Work Type</h4>
                    </div>
                    <div class="col">
                        <h4>Employment Type</h4>
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <h4>Salary Range</h4>
                    </div>
                    <div class="col">
                        <h4>Age Requirement</h4>
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <h4>Hours</h4>
                    </div>
                    <div class="col">
                        <h4>Skills</h4>
                    </div>
                </div>
                <div class="row">
                    <div class="row">
                        <h4>Summary</h4>
                    </div>
                </div>
                <div class="row">
                    <div class="row">
                        <h4>More Info</h4>
                    </div>
                </div>
            </div>
            <div class="col bg-warning">
                <h4>Summary</h4>
            </div>
        </div>
        <div class="row">
            <div class="col bg-danger">
                <h4>Apply</h4>
            </div>
            <div class="col bg-success">
                <h4>Save</h4>
            </div>
            <div class="col bg-danger">
                <h4>Hide</h4>
            </div>
        </div>
    </div>

    <script src="bootstrap-5.3.8-dist/js/bootstrap.min.js"></script>
</body>
</html>
