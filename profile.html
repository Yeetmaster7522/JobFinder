<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finder</title>
    <link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="main.css">
</head>
<body class="bg-dark text-light">
    <a href="logIn.html" class="z-1 position-absolute bottom-0 end-0" id="log-out-btn" style="margin-right: 1em;">Log Out</a>
    <div class="container-fluid">
        <!-- Top navigation bar -->
        <div class="row mb-3" id="navbar"></div>
        <div class="row">
            <div class="col ms-5 me-3">
                <!-- Personal details -->
                <div class="row mb-2">
                    <div class="col container">
                        <div class="row">
                            <div class="col">
                                <h3 id="name" contenteditable="true"></h3>
                            </div>
                            <div class="col">
                                <img alt="profile picture" width="50vw" height="50vh" id="profile-pic">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <p id="email" contenteditable="true"></p>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <p id="number" contenteditable="true"></p>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <p id="suburb" contenteditable="true"></p>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- resume -->
                <div class="row bg-secondary mb-2">
                    <div class="col container">
                        <div class="row">
                            <div class="col">
                                <h4>Resume</h4>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col container">
                                <div class="row">
                                    <div class="col">
                                        <img src="placeholder.png" alt="pdf icon" width="30vh" height="30vh">
                                    </div>
                                    <div class="col">
                                        <p id="resume-title"></p>
                                        <p id="resume-date"></p>
                                    </div>
                                    <div class="col">
                                        <div class="dropdown">
                                            <button class="btn dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                                                ...
                                            </button>
                                            <ul class="dropdown-menu">
                                                <li>
                                                    <label for="resumeFile" class="form-label">Insert File</label>
                                                    <input class="form-control" type="file" id="resumeFile">
                                                </li>
                                                <li><a class="dropdown-item" href="#">Edit</a></li>
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- qualifications -->
                <div class="row bg-secondary text-center mb-2">
                    <div class="col">
                        <h4>Qualifications</h4>
                    </div>
                    <div class="col">
                        <h4 class="clickable" data-bs-toggle="collapse" data-bs-target="#qualifications-box">></h4>
                    </div>
                </div>
                <div class="row bg-secondary collapse text-center" id="qualifications-box">
                    <div class="col container">
                        <div class="row">
                            <div class="col">
                                <h4>Education:</h4>
                            </div>
                            <div class="col">
                                <h4 id="education" contenteditable="true"></h4>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <h4>Skills</h4>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <ul id="skills-list" contenteditable="true">
                                </ul>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <h4>Certifications</h4>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <ul id="cert-list" contenteditable="true">
                                </ul>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <h4>Work eligibility</h4>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <p id="work-eligibility" contenteditable="true"></p>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- preferences -->
                <div class="row bg-secondary text-center mb-2">
                    <div class="col">
                        <h4>Preferences</h4>
                    </div>
                    <div class="col">
                        <h4 class="clickable" data-bs-toggle="collapse" data-bs-target="#preference-box">></h4>
                    </div>
                </div>
                <div class="row bg-secondary collapse text-center" id="preference-box">
                    <div class="col container">
                        <div class="row">
                            <div class="col">
                                <h4>Industries</h4>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <ul id="industry-list" contenteditable="true">
                                </ul>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <h4>Min salary:</h4>
                            </div>
                            <div class="col">
                                <h4 id="min-salary" contenteditable="true"></h4>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <h4>Hours</h4>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <ul id="hours" contenteditable="true">
                                </ul>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <h4>Work type:</h4>
                            </div>
                            <div class="col">
                                <h4 id="work-type" contenteditable="true"></h4>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <h4>Employment type:</h4>
                            </div>
                            <div class="col">
                                <h4 id="employment-type" contenteditable="true"></h4>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <h4>Location radius:</h4>
                            </div>
                            <div class="col">
                                <h4 id="loc-radius" contenteditable="true"></h4>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- saved jobs -->
                <div class="row bg-secondary text-center mb-2">
                    <div class="col">
                        <h4>Saved Jobs</h4>
                    </div>
                    <div class="col">
                        <h4 class="clickable" data-bs-toggle="collapse" data-bs-target="#saved-box">></h4>
                    </div>
                </div>
                <div class="row bg-secondary collapse" id="saved-box">
                    <div class="col">
                        <ul class="list-group text-center bg-dark text-light" id="saved-jobs">
                            <!-- <li class="list-group-item"><p>MM.YY XXXXXXXXXXXX / Status</p></li> -->
                        </ul>
                    </div>
                </div>
                <!-- hidden jobs -->
                <div class="row bg-secondary text-center mb-2">
                    <div class="col">
                        <h4>Hidden Jobs</h4>
                    </div>
                    <div class="col">
                        <h4 class="clickable" data-bs-toggle="collapse" data-bs-target="#hidden-box">></h4>
                    </div>
                </div>
                <div class="row bg-secondary collapse" id="hidden-box">
                    <div class="col">
                        <ul class="list-group text-center bg-dark text-light" id="hidden-jobs">
                            <!-- <li class="list-group-item"><p>MM.YY XXXXXXXXXXXX / Status</p></li> -->
                        </ul>
                    </div>
                </div>
            </div>
            <!-- applied jobs -->
            <div class="col container me-5 ms-3">
                <div class="row">
                    <div class="col text-center">
                        <h4>Applied Jobs</h4>
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <ul class="list-group text-center" id="applied-jobs">
                            <!-- <li class="list-group-item bg-dark text-light"><p>MM.YY XXXXXXXXXXXX / Status</p></li> -->
                        </ul>
                    </div>
                </div>
            </div>
        </div>
        
    </div>

    <script src="bootstrap-5.3.8-dist/js/bootstrap.bundle.js"></script>
    <script src="logic/main.js"></script>
    <script src="logic/manageUser.js"></script>
</body>
</html>
