<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finder</title>
    <link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="container-fluid">
        <!-- Top navigation bar -->
        <div class="row" id="navbar"></div>
        <div class="row">
            <div class="col ms-5 me-3">
                <!-- Personal details -->
                <div class="row bg-info">
                    <div class="col container">
                        <div class="row">
                            <div class="col">
                                <h3 id="name"></h3>
                            </div>
                            <div class="col">
                                <img src="placeholder.png" alt="profile picture" width="50vw" height="50vh">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <p id="email"></p>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <p>0102 567 819</p>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <p>Snowtown</p>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- resume -->
                <div class="row bg-warning">
                    <div class="col container">
                        <div class="row">
                            <div class="col">
                                <h4>Resume</h4>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col container">
                                <div class="row">
                                    <div class="col">
                                        <img src="placeholder.png" alt="pdf icon" width="30vh" height="30vh">
                                    </div>
                                    <div class="col">
                                        <p>resume-final-final.pdf</p>
                                        <p>Added: 10.12.2024</p>
                                    </div>
                                    <div class="col">
                                        <p>...</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- qualifications -->
                <div class="row bg-info text-center">
                    <div class="col">
                        <h4>Qualifications</h4>
                    </div>
                    <div class="col">
                        <h4>></h4>
                    </div>
                </div>
                <!-- preferences -->
                <div class="row bg-warning text-center">
                    <div class="col">
                        <h4>Preferences</h4>
                    </div>
                    <div class="col">
                        <h4>></h4>
                    </div>
                </div>
                <!-- saved jobs -->
                <div class="row bg-info text-center">
                    <div class="col">
                        <h4>Saved Jobs</h4>
                    </div>
                    <div class="col">
                        <h4>></h4>
                    </div>
                </div>
                <!-- hidden jobs -->
                <div class="row bg-warning text-center">
                    <div class="col">
                        <h4>Hidden Jobs</h4>
                    </div>
                    <div class="col">
                        <h4>></h4>
                    </div>
                </div>
            </div>
            <div class="col container bg-danger me-5 ms-3">
                <div class="row">
                    <div class="col text-center">
                        <h4>Applied Jobs</h4>
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <ul class="list-group text-center" id="applied-jobs">
                            <!-- <li class="list-group-item"><p>MM.YY XXXXXXXXXXXX / Status</p></li> -->
                        </ul>
                    </div>
                </div>
            </div>
        </div>
        
    </div>

    <script src="bootstrap-5.3.8-dist/js/bootstrap.bundle.js"></script>
    <script src="main.js"></script>
    <script src="manageUser.js"></script>
</body>
</html>
