<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finder</title>
    <link rel="stylesheet" href="/css/custom.css">
</head>
<body class="bg-dark text-light">
    <div class="modal fade" id="modal-popup" tabindex="-1" aria-labelledby="modal-label" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content bg-dark text-light">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="modal-label">Modal title</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
    <div class="container-fluid">
        <!-- Top navigation bar -->
        <div class="row mb-3" id="navbar"></div>
        <div class="row align-items-start">
            <div class="col">
                <ul class="list-group bg-dark" id="previews"></ul>
            </div>
            <div class="col bg-teal rounded-2 shadow-strong" id="preview">
                <div class="row gy-3 p-2">
                    <div class="col-12 text-center">
                        <p id="name" class="fs-4"></p>
                    </div>
                    <div class="col-12 text-center">
                        <button type="button" class="btn btn-secondary" id="resume">Click for resume</button>
                    </div>
                    <div class="col-6">
                        <div class="form-floating">
                            <input type="email" class="form-control bg-dark text-light" id="email" placeholder="name@example.com" disabled>
                            <label for="email">Email Address</label>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="form-floating">
                            <input type="text" class="form-control bg-dark text-light" id="phone-contact" placeholder="0000 000 000" disabled>
                            <label for="phone-contact">Phone Contact</label>
                        </div>
                    </div>
                    <div class="col-12">
                        <div class="form-floating">
                            <input type="text" class="form-control bg-dark text-light" id="education-level" placeholder=" " disabled>
                            <label for="education-level">Education Level</label>
                        </div>
                    </div>
                    <div class="col-12">
                        <div class="form-floating">
                            <textarea class="form-control bg-dark text-light" id="certifications-list" placeholder=" " disabled style="height: 7em;"></textarea>
                            <label for="certifications-list">Certifications</label>
                        </div>
                    </div>
                    <div class="col-6 text-center">
                        <div class="form-floating">
                            <textarea class="form-control bg-dark text-light" id="skills-list" placeholder=" " disabled style="height: 12em;"></textarea>
                            <label for="skills-list">Skills</label>
                        </div>
                    </div>
                    <div class="col-6 text-center">
                        <div class="form-floating">
                            <textarea class="form-control bg-dark text-light" id="availability-timestamp" placeholder=" " disabled style="height: 12em;"></textarea>
                            <label for="availability-timestamp">Availability</label>
                        </div>
                    </div>
                    <div class="col-6 text-start">
                        <button class="btn btn-secondary" type="button" id="interested-btn">Shortlist</button>
                    </div>
                    <div class="col-6 text-end">
                        <button class="btn btn-secondary" type="button" id="reject-btn">Reject</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/bootstrap.bundle.min.js"></script>
    <script src="/logic/main.js"></script>
    <script src="/logic/navbar.js"></script>
    <script src="/logic/applicantViewer.js"></script>
</body>
</html>
