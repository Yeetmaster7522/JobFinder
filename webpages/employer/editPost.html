<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finder</title>
    <link rel="stylesheet" href="/css/custom.css">
</head>
<body class="bg-charcoalnavy text-light">
    <div class="modal fade" id="modal-popup" tabindex="-1" aria-labelledby="modal-label" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content bg-charcoalnavy text-light">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="modal-label">Modal title</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
    <div class="container-fluid">
        <div class="row mb-3" id="navbar"></div>
        <div class="row mb-3">
            <div class="col-12 text-center">
                <h2>Edit Post</h2>
            </div>
        </div>
        <div class="row gy-3 gx-4 mb-3">
            <div class="col-6">
                <div class="form-floating">
                    <input type="text" class="form-control bg-transparent text-light" id="job-title-entry" autocomplete="off">
                    <label for="job-title-entry">Job Title</label>
                </div>
            </div>
            <div class="col-6">
                <div class="form-floating">
                    <input type="text" class="form-control bg-transparent text-light" id="recruitment-period-entry" placeholder="Disabled" disabled>
                    <label for="recruitment-period-entry">Recruitment Period</label>
                </div>
            </div>
            <div class="col-6">
                <select id="work-type-entry" class="form-select bg-dark text-light">
                    <option selected>Work Type</option>
                    <option value="onsite">Onsite</option>
                    <option value="remote">Remote</option>
                    <option value="hybrid">Hybrid</option>
                </select>
            </div>
            <div class="col-6">
                <select id="employment-type-entry" class="form-select bg-dark text-light">
                    <option selected>Employment Type</option>
                    <option value="part-time">Part-time</option>
                    <option value="casual">Casual</option>
                    <option value="full-time">Full-time</option>
                </select>
            </div>
            <div class="col-6">
                <div class="form-floating">
                    <input type="text" class="form-control bg-transparent text-light" id="industry-entry" placeholder="Industry" autocomplete="off">
                    <label for="industry-entry">Industry</label>
                </div>
            </div>
            <div class="col-6">
                <div class="form-floating">
                    <input type="number" class="form-control bg-transparent text-light" id="age-entry" placeholder="Age Requirement">
                    <label for="age-entry">Age Requirement</label>
                </div>
            </div>
            <div class="col-6">
                <div class="form-floating">
                    <textarea type="text" class="form-control bg-transparent text-light" id="hours-entry" placeholder="Hours" style="height: 10em;"></textarea>
                    <label for="hours-entry">Hours</label>
                </div>
            </div>
            <div class="col-6">
                <div class="form-floating">
                    <textarea type="text" class="form-control bg-transparent text-light" id="skills-entry" placeholder="Skill Tags" style="height: 10em;"></textarea>
                    <label for="skills-entry">Skill Tags</label>
                </div>
            </div>
            <div class="col-12">
                <div class="form-floating">
                    <textarea type="text" class="form-control bg-transparent text-light" id="description-entry" placeholder="Description" style="height: 15em;"></textarea>
                    <label for="description-entry">Description</label>
                </div>
            </div>
            <div class="col-1">
                <div class="form-floating">
                    <input type="number" class="form-control bg-transparent text-light" id="salary-min-entry" placeholder="Min">
                    <label for="salary-min-entry">Min</label>
                </div>
            </div>
            <div class="col-1 text-center small d-flex align-items-center justify-content-center">
                <p>- Salary -</p>
            </div>
            <div class="col-1">
                <div class="form-floating">
                    <input type="number" class="form-control bg-transparent text-light" id="salary-max-entry" placeholder="Max">
                    <label for="salary-max-entry">Max</label>
                </div>
            </div>
            <div class="col-md-5 d-flex flex-column me-md-auto">
                <div class="form-floating">
                    <input type="text" class="form-control bg-transparent text-light" id="address-entry" placeholder="Address" autocomplete="off">
                    <label for="address-entry">Address</label>
                </div>
                <a href="#" id="use-address" class="ms-auto small">Use Profile Address</a>
            </div>
        </div>
        <div class="row justify-content-center mb-1">
            <div class="col-auto">
                <button type="button" class="btn bg-mediumblue text-light btn-light" id="submit-btn">Submit edit</button>
            </div>
        </div>
    </div>
    
    <script src="/js/bootstrap.bundle.min.js"></script>
    <script src="/logic/main.js"></script>
    <script src="/logic/navbar.js"></script>
    <script src="/logic/postViewer.js"></script>
</body>
</html>
