<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finder</title>
    <link rel="stylesheet" href="/bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/main.css">
</head>
<body class="bg-dark text-light">
    <div class="container-fluid">
        <div class="row mb-3" id="navbar"></div>
        <div class="row">
            <div class="col">
                <p>edit post</p>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <p>job title</p>
            </div>
            <div class="col">
                <p>recruitment period</p>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <input type="text" class="form-control" id="job-title-entry">
            </div>
            <div class="col">
                <input type="text" class="form-control" id="recruitment-period-entry" placeholder="Disabled" disabled>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <p>work type</p>
            </div>
            <div class="col">
                <p>employment type</p>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <input type="text" class="form-control" id="work-type-entry">
            </div>
            <div class="col">
                <input type="text" class="form-control" id="employment-type-entry">
            </div>
        </div>
        <div class="row">
            <div class="col">
                <p>industry</p>
            </div>
            <div class="col">
                <p>age requirement</p>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <input type="text" class="form-control" id="industry-entry">
            </div>
            <div class="col">
                <input type="text" class="form-control" id="age-entry" placeholder="Disabled" disabled>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <p>hours</p>
            </div>
            <div class="col">
                <p>skill tags</p>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <textarea type="text" class="form-control" id="hours-entry"></textarea>
            </div>
            <div class="col">
                <textarea type="text" class="form-control" id="skills-entry"></textarea>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <p>description</p>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <textarea type="text" class="form-control" id="description-entry"></textarea>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <p>salary</p>
            </div>
            <div class="col">
                <p>address</p>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <input type="text" class="form-control" id="salary-min-entry">
            </div>
            <div class="col">
                <p>to</p>
            </div>
            <div class="col">
                <input type="text" class="form-control" id="salary-max-entry">
            </div>
            <div class="col">
                <input type="text" class="form-control" id="address-entry">
            </div>
        </div>
        <div class="row">
            <div class="col">
                <button type="button" class="btn bg-secondary" id="submit-btn">Create post</button>
            </div>
        </div>
    </div>
    
    <script src="/bootstrap-5.3.8-dist/js/bootstrap.bundle.js"></script>
    <script src="/logic/main.js"></script>
    <script src="/logic/navbar.js"></script>
    <script src="/logic/postViewer.js"></script>
</body>
</html>
