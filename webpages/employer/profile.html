<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finder</title>
    <link rel="stylesheet" href="/css/custom.css">
</head>
<body class="bg-charcoalnavy text-light position-relative min-vh-100">
    <div class="modal fade" id="modal-popup" tabindex="-1" aria-labelledby="modal-label" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content bg-charcoalnavy text-light">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="modal-label">Modal title</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
    <a href="/webpages/shared/logIn.html" class="z-1 position-absolute bottom-0 end-0 me-2 mb-2 text-decoration-none text-primary" id="log-out-btn">Log Out</a>
    <div class="container-fluid">
        <!-- Top navigation bar -->
        <div class="row mb-3" id="navbar"></div>
        <div class="row justify-content-center">
            <div class="col-6 bg-deepblue rounded-2 py-2 px-2 shadow-strong">
                <div class="row gy-3 gx-2" id="form-container">
                    <div class="col-12">
                        <img alt="profile picture" width="50" height="50" class="rounded-1" id="profile-pic">
                    </div>
                    <div class="col-12 align-self-end">
                        <div class="input-group">
                            <span class="input-group-text bg-mediumblue text-light" style="width: 9em;">Company Name</span>
                            <input type="text" id="company-name" class="form-control bg-dark text-light">
                        </div>
                    </div>
                    <div class="col-12">
                        <div class="input-group">
                            <span class="input-group-text bg-mediumblue text-light" style="width: 9em;">Address</span>
                            <input type="text" id="address" class="form-control bg-dark text-light">
                        </div>
                    </div>
                    <div class="col-12">
                        <div class="input-group">
                            <span class="input-group-text bg-mediumblue text-light" style="width: 9em;">Contact Number</span>
                            <input type="text" id="contact-number" class="form-control bg-dark text-light">
                        </div>
                    </div>
                    <div class="col-12">
                        <div class="input-group">
                            <span class="input-group-text bg-mediumblue text-light" style="width: 9em;">Contact Email</span>
                            <input type="text" id="contact-email" class="form-control bg-dark text-light">
                        </div>
                    </div>
                    <div class="col-12">
                        <div class="input-group">
                            <span class="input-group-text bg-mediumblue text-light" style="width: 9em;">Website</span>
                            <input type="text" id="website" class="form-control bg-dark text-light">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/bootstrap.bundle.min.js"></script>
    <script src="/logic/main.js"></script>
    <script src="/logic/manageUser.js"></script>
    <script src="/logic/navbar.js"></script>
</body>
</html>
