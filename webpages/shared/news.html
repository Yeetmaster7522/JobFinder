<!DOCTYPE html>
<html lang="en">
<head>

            </div>
            <div class="col bg-teal col-2 ms-3 me-3">

                <ul id="skill-shortages">
                </ul>
            </div>
        </div>

    <script src="/bootstrap.bundle.min.js"></script>
