<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finder</title>
    <link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="main.css">
</head>
<body class="bg-dark text-light">
    <div class="container-fluid">
        <!-- Top navigation bar -->
        <div class="row mb-2" id="navbar"></div>
        <!-- Header -->
        <div class="row mb-5">
            <div class="col text-center">
                <h2>Log In</h2>
            </div>
        </div>
        <!-- Email -->
        <div class="row mb-5">
            <div class="col container col-5">
                <div class="row">
                    <div class="col">
                        <h5>Email</h5>
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <input type="text" class="form-control" id="email-input">
                    </div>
                </div>
            </div>
        </div>
        <!-- Password -->
        <div class="row mb-5">
            <div class="col container col-5">
                <div class="row">
                    <div class="col">
                        <h5>Password</h5>
                    </div>
                    <div class="col text-end">
                        <a href="#" id="forgot-pswrd">Forgot your password?</a>
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <input type="password" class="form-control" id="password-input">
                    </div>
                </div>
            </div>
        </div>
        <!-- Button -->
        <div class="row justify-content-center">
            <div class="col col-5">
                <button type="button" class="btn bg-secondary w-100 fs-5 text-light" id="log-in-btn">Log In</button>
            </div>
        </div>
        <!-- sign up redirect -->
        <div class="row justify-content-center">
            <div class="col col-2 text-center">
                <p>No account? <a href="signUp.html">Sign Up</a></p>
            </div>
        </div>
    </div>
    <script src="logic/main.js"></script>
    <script src="logic/logUser.js"></script>
</body>
</html>
