<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finder</title>
    <link rel="stylesheet" href="/css/custom.css">
    <link rel="stylesheet" href="/main.css">
</head>
<body class="bg-dark">
    <div class="container-fluid">
        <!-- Top navigation bar -->
        <div class="row" id="navbar"></div>
        <!-- Search bar -->
        <div class="row justify-content-center bg-teal">
            <div class="col col-6 m-2">
                <input type="search" class="form-control fs-3" placeholder="Search" id="search-bar">
            </div>
        </div>
        <!-- Latest career advice -->
        <div class="row bg-secondary">
            <div class="col text-center">
                <h3 class="text-light">Latest Career Advice</h3>
            </div>
        </div>
        <div class="row justify-content-center bg-secondary" id="latest-advice"></div>
        <!-- other -->
        <div class="row justify-content-center" style="margin-top: 5vw;" id="other-advice"></div>
    </div>

    <script src="/bootstrap.bundle.min.js"></script>
    <script src="/logic/main.js"></script>
    <script src="/logic/articleManager.js">
        window.addEventListener("mainReady", () => {
            const articleManager = new ArticleManager(window.main.articles);
            articleManager.displayArticles();

            document.getElementById("search-bar").addEventListener("search", (e) => {
                articleManager.searchArticle(e);
            });
        });
    </script>
    <script src="/logic/navbar.js"></script>
</body>
</html>
