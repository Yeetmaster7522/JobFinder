<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finder</title>
    <link rel="stylesheet" href="/css/custom.css">
</head>
<body class="bg-dark">
    <div class="container-fluid">
        <!-- Top navigation bar -->
        <div class="row" id="navbar"></div>
        <!-- Search bar -->
        <div class="row justify-content-center mb-3 mt-1">
            <div class="col col-6 m-2">
                <input type="search" class="form-control fs-6 border-3 border-secondary shadow-strong bg-transparent text-light" placeholder="Search from articles..." id="search-bar">
            </div>
        </div>
        <!-- Latest career advice -->
        <div class="bg-secondary-transparent mb-5 pt-2 pb-3 mx-3 rounded-2">
            <h2 class="text-light text-center">Latest Career Advice</h2>
            <div class="row justify-content-center column-gap-7" id="latest-advice"></div>
        </div>
        <!-- other -->
        <div class="row justify-content-center mt-3 justify-content-evenly column-gap-5 row-gap-5 px-3" id="other-advice"></div>
    </div>

    <script src="/js/bootstrap.bundle.min.js"></script>
    <script src="/logic/main.js"></script>
    <script src="/logic/articleManager.js"></script>
    <script src="/logic/navbar.js"></script>
    <script>
        window.addEventListener("mainReady", () => {
            const articleManager = new ArticleManager(window.main.articles);
            articleManager.displayArticles();

            document.getElementById("search-bar").addEventListener("search", (e) => {
                articleManager.searchArticle(e);
            });
        });
    </script>
</body>
</html>
