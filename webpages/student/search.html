<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finder</title>
    <link rel="stylesheet" href="/css/custom.css">
</head>
<body class="bg-dark text-white position-relative">
    <!-- <div class="row d-none" id="none-left-header">
        <div class="col justify-content-center d-flex align-items-center">
            <h1>There are no more job posts to view.</h1>
        </div>
    </div> -->
    <!-- Scroll arrows -->
    <div class="position-absolute top-50 end-0 me-5 d-flex flex-column gap-2">
        <button class="shadow-strong" id="scroll-up-btn">↑</button>
        <button class="shadow-strong" id="scroll-down-btn">↓</button>
    </div>
    <div class="container-fluid row-gap-3 d-grid">
        <!-- Top navigation bar -->
        <div class="row" id="navbar"></div>
        <!-- Search and filters -->
        <div class="row justify-content-center">
            <div class="col col-auto">
                <div class="input-group fs-6">
                    <span class="text-light input-group-text bg-transparent" id="postCounter">0/0 Posts</span>
                    <input type="search" class="form-control bg-transparent" placeholder="Search" id="search-bar">
                    <button class="btn btn-light dropdown-toggle border border-outline-white bg-transparent text-light" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">Filters</button>
                    <ul class="dropdown-menu">
                        <li><button class="dropdown-item" type="button" value="None" id="clear-filters">Remove all</button></li>
                        <li class="btn-group dropend">
                            <button class="dropdown-item dropdown-toggle submenu" data-bs-toggle="dropdown">Employment Type</button>
                            <ul class="dropdown-menu">
                                <li><button class="dropdown-item" value="part-time" data-bs-toggle="button" aria-pressed="false" id="part-time-btn">Part-time</button></li>
                                <li><button class="dropdown-item" value="casual" data-bs-toggle="button" aria-pressed="false" id="casual-btn">Casual</button></li>
                                <li><button class="dropdown-item" value="full-time" data-bs-toggle="button" aria-pressed="false" id="full-time-btn">Full-time</button></li>
                            </ul>
                        </li>
                        <li class="btn-group dropend">
                            <button class="dropdown-item dropdown-toggle submenu" data-bs-toggle="dropdown">Work Type</button>
                            <ul class="dropdown-menu">
                                <li><button class="dropdown-item" value="onsite" data-bs-toggle="button" aria-pressed="false" id="onsite-btn">Onsite</button></li>
                                <li><button class="dropdown-item" value="remote" data-bs-toggle="button" aria-pressed="false" id="remote-btn">Remote</button></li>
                                <li><button class="dropdown-item" value="hybrid" data-bs-toggle="button" aria-pressed="false" id="hybrid-btn">Hybrid</button></li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        <!-- Overview of job -->
        <div class="container w-50">
            <div class="row justify-content-center bg-teal rounded-2 px-4 pt-3 shadow-strong" id="post-overview">
                <div class="col">
                    <div class="row gy-2 gx-4">
                        <div class="col-12">
                            <div class="bg-secondary rounded-3 p-1">
                                <h4 class="text-center m-0 fw-bold" id="job-title"></h4>
                                <h5 class="text-center m-0 fw-semibold fst-italic" id="company-name"></h5>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="bg-secondary rounded-3 p-1">
                                <p class="text-center m-0 fs-6" id="address"></p>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="bg-secondary rounded-3 p-1">
                                <p class="text-center m-0 fs-6" id="work-type"></p>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="bg-secondary rounded-3 p-1">
                                <p class="text-center m-0 fs-6" id="employ-type"></p>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="bg-secondary rounded-3 p-1">
                                <p class="text-center m-0 fs-6" id="salary-range"></p>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="bg-secondary rounded-3 p-1">
                                <p class="text-center m-0 fs-6" id="age-require"></p>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="bg-secondary rounded-3 p-1">
                                <p class="text-center m-0 fs-6 mb-1">Hours</p>
                                <ul class="list-group list-group-flush small lh-sm text-center" id="hours"></ul>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="bg-secondary rounded-3 p-1">
                                <p class="text-center m-0 fs-6 mb-1">Skills</p>
                                <ul class="list-group list-group-flush small lh-sm text-center" id="skills"></ul>
                            </div>
                        </div>
                        <div class="col-12">
                            <p class="text-center collapse show fs-6" id="summary-header">Summary</p>
                            <p class="text-start collapse show fs-6 fw-light fst-italic" id="short-summary"></p>
                        </div>
                        <div class="col-4 d-flex align-items-end pb-2">
                            <p class="text-start fs-6 fw-lighter mb-0 w-100" id="date-posted"></p>
                        </div>
                        <div class="col-4 d-flex justify-content-center align-items-center pb-2">
                            <button type="button" class="btn text-center text-light btn-light bg-secondary" data-bs-toggle="collapse" data-bs-target="#summary-header, #short-summary, #summary-box" id="more-btn">More Info</button>
                        </div>
                        <div class="col-4 d-flex align-items-end pb-2">
                            <p class="text-end fs-6 fw-lighter mb-0 w-100" id="date-deadline"></p>
                        </div>
                    </div>
                </div>
                <!-- Expanded summary -->
                <div class="col col-6 collapse" id="summary-box">
                    <p class="text-center fs-5">Description</p>
                    <p class="text-start fs-6" id="full-summary"></p>
                </div>
            </div>
        </div>
        <!-- Quick actions -->
        <div class="row justify-content-center pb-2" id="action-buttons">
            <div class="col bg-teal rounded-2 p-2 col-auto shadow-strong">
                <button type="button" class="btn bg-secondary rounded-3 text-light btn-light" id="apply-btn">Apply</button>
                <button type="button" class="btn bg-secondary rounded-3 text-light btn-light" id="save-btn">Save</button>
                <button type="button" class="btn bg-secondary rounded-3 text-light btn-light" id="hide-btn">Hide</button>
            </div>
        </div>
    </div>

    <script src="/bootstrap.bundle.min.js"></script>
    <script src="/logic/main.js"></script>
    <script src="/logic/jobFetcher.js"></script>
    <script src="/logic/navbar.js"></script>
    <script>
        window.addEventListener("mainReady", () => {
            const jf = new JobFetcher(window.main.getUser(), window.main.jobPosts);
            jf.displayPostAtI(0);

            document.getElementById("scroll-up-btn").addEventListener("click", () => jf.scrollPost(false));
            document.getElementById("scroll-down-btn").addEventListener("click", () => jf.scrollPost());

            // quick buttons
            document.getElementById("apply-btn").addEventListener("click", () => jf.applyToPost());
            document.getElementById("save-btn").addEventListener("click", () => jf.savePost());
            document.getElementById("hide-btn").addEventListener("click", () => jf.hidePost());

            // combine search and dropdown stuff
            const searchBar = document.getElementById("search-bar");
            searchBar.addEventListener("search", (event) => {
                let postIds = jf.filterSearch().filter(x => jf.searchPosts(event.target.value).includes(x))
                jf.updatePosts(postIds);
            });

            document.querySelectorAll(".dropdown-item:not(.submenu):not(#clear-filters)").forEach(item => {
                item.addEventListener("click", () => {
                    let idLists = [
                        jf.filterSearch(),
                        jf.searchPosts(searchBar.value),
                        jf.preferenceSearch()
                    ]
                    let postIds = idLists.reduce(
                        (acc, list) => acc.filter(id => list.includes(id))
                    );
                    jf.updatePosts(postIds);
                });
            });

            document.getElementById("clear-filters").addEventListener("click", () => {
                document.querySelectorAll(".dropdown-item").forEach(item => {
                    item.classList.remove("active");
                    item.setAttribute("aria-pressed", "false");
                    
                    jf.updatePosts(jf.getOgPosts());
                });
            });

            document.getElementById("more-btn").addEventListener("click", (e) => {
                const innerText = e.target.innerText;
                if (innerText == "More Info") {
                    e.target.innerText = "Less Info";
                }
                else {
                    e.target.innerText = "More Info";
                }
            });
        });
    </script>
</body>
</html>
