<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finder</title>
    <link rel="stylesheet" href="/css/custom.css">
    <link rel="stylesheet" href="/main.css">
</head>
<body class="bg-dark text-light position-relative">
    <a href="advice.html" type="btn" class="btn text-light bg-teal btn-light fs-4 z-1 position-absolute start-0 ms-2 shadow-strong" style="top: 80px;">Back</a>
    <div class="container-fluid text-center">
        <!-- Top navigation bar -->
        <div class="row mb-2" id="navbar"></div>
        <!-- Search bar (turned to back bar) -->
        <div class="row justify-content-center mb-3">
            <div class="col">
                <h1 id="title"></h1>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <img class="w-25 h-auto rounded-2" id="thumbnail">
            </div>
        </div>
        <div class="row px-7 my-3">
            <hr class="border border-secondary border-2 opacity-75">
        </div>
        <div class="row justify-content-center">
            <div class="col text-break col-8">
                <p id="content"></p>
            </div>
        </div>
    </div>

    <script src="/bootstrap.bundle.min.js"></script>
    <script src="/logic/main.js"></script>
    <script src="/logic/articleManager.js"></script>
    <script src="/logic/navbar.js"></script>
    <script>
        window.addEventListener("mainReady", () => {
            const articleManager = new ArticleManager(window.main.articles);
            articleManager.showArticle();
        });
    </script>
</body>
</html>
