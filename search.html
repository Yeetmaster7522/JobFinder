<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finder</title>
    <link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="container-fluid">
        <!-- Top navigation bar -->
        <div class="row" id="navbar"></div>
        <!-- Search and filters -->
        <div class="row justify-content-center">
            <div class="col bg-success col-1">
                <h4 class="text-center" id="postCounter">0/0 Job Posts</h4>
            </div>
            <div class="col bg-danger col-1">
                <h4 class="text-center">Search</h4>
            </div>
            <div class="col bg-success col-1">
                <h4 class="text-center">Filters</h4>
            </div>
        </div>
        <!-- Overview of job -->
        <div class="row justify-content-center">
            <div class="col container col-4">
                <div class="row">
                    <div class="col container bg-info">
                        <div class="row">
                            <div class="col">
                                <h4 class="text-center" id="job-title"></h4>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <h4 class="text-center" id="company-name"></h4>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row bg-success">
                    <div class="col">
                        <h4 class="text-center" id="address"></h4>
                    </div>
                </div>
                <div class="row">
                    <div class="col bg-primary">
                        <h4 class="text-center" id="work-type"></h4>
                    </div>
                    <div class="col bg-secondary">
                        <h4 class="text-center" id="employ-type"></h4>
                    </div>
                </div>
                <div class="row">
                    <div class="col bg-secondary">
                        <h4 class="text-center" id="salary-range"></h4>
                    </div>
                    <div class="col bg-primary">
                        <h4 class="text-center" id="age-require"></h4>
                    </div>
                </div>
                <div class="row">
                    <div class="col bg-primary">
                        <h4 class="text-center" id="hours"></h4>
                    </div>
                    <div class="col bg-secondary">
                        <h4 class="text-center" id="skills"></h4>
                    </div>
                </div>
                <div class="row">
                    <div class="col container bg-info">
                        <div class="row">
                            <div class="col">
                                <h4 class="text-center">Summary</h4>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <p class="text-start summary-text"></p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col bg-success">
                        <h4 class="text-center clickable" data-bs-toggle="collapse" data-bs-target="#summary-box">More Info</h4>
                    </div>
                </div>
                <div class="row">
                    <div class="col bg-info">
                        <p class="text-start" id="date-posted"></p>
                    </div>
                    <div class="col bg-secondary">
                        <p class="text-end" id="date-deadline"></p>
                    </div>
                </div>
            </div>
            <!-- Expanded summary -->
            <div class="col container bg-warning collapse col-4" id="summary-box">
                <div class="row">
                    <div class="col">
                        <h4 class="text-center">Summary</h4>
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <p class="text-start summary-text"></p>
                    </div>
                </div>
            </div>
        </div>
        <!-- Quick actions -->
        <div class="row justify-content-center">
            <div class="col bg-danger col-1">
                <h4 class="text-center col-1">Apply</h4>
            </div>
            <div class="col bg-success col-1">
                <h4 class="text-center">Save</h4>
            </div>
            <div class="col bg-danger col-1">
                <h4 class="text-center">Hide</h4>
            </div>
        </div>
    </div>
    <!-- Scroll arrows -->
    <div class="container z-1 position-absolute">
        <div class="row">
            <div class="col">
                <button id="scroll-up-btn">↑</button>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <button id="scroll-down-btn">↓</button>
            </div>
        </div>
    </div>

    <script src="bootstrap-5.3.8-dist/js/bootstrap.min.js"></script>
    <script src="jobFetcher.js"></script>
    <script src="main.js"></script>
</body>
</html>
