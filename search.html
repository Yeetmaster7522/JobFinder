<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finder</title>
    <link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="main.css">
</head>
<body class="bg-dark text-white">
    <div class="container-fluid">
        <!-- Top navigation bar -->
        <div class="row mb-2" id="navbar"></div>
        <!-- Search and filters -->
        <div class="row justify-content-center mb-2">
            <div class="col-1 me-3 d-flex align-items-center bg-teal">
                <h5 class="text-light" id="postCounter">0/0 Posts</h5>
            </div>
            <div class="col-1">
                <input type="search" class="form-control fs-5 bg-teal" placeholder="Search" id="search-bar">
            </div>
            <div class="col-1 ms-3">
                <div class="dropdown text-start">
                    <button class="btn btn-success dropdown-toggle bg-teal" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
                        Filters
                    </button>
                    <ul class="dropdown-menu">
                        <li><button class="dropdown-item" type="button" value="None">Remove all</button></li>
                        <li class="btn-group dropend">
                            <button class="dropdown-item dropdown-toggle" data-bs-toggle="dropdown">Employment Type</button>
                            <ul class="dropdown-menu">
                                <li><button class="dropdown-item" value="employ-part">Part time</button></li>
                                <li><button class="dropdown-item" value="employ-casual">Casual</button></li>
                                <li><button class="dropdown-item" value="employ-full">Full time</button></li>
                            </ul>
                        </li>
                        <li class="btn-group dropend">
                            <button class="dropdown-item dropdown-toggle" data-bs-toggle="dropdown">Work Type</button>
                            <ul class="dropdown-menu">
                                <li><button class="dropdown-item" value="work-onsite">Onsite</button></li>
                                <li><button class="dropdown-item" value="work-remote">Remote</button></li>
                                <li><button class="dropdown-item" value="work-hybrid">Hybrid</button></li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        <!-- Overview of job -->
        <div class="row justify-content-center mb-2" id="post-overview">
            <div class="col-4 container bg-teal">
                <div class="row">
                    <div class="col container mt-3 mb-3 ms-3 me-3 bg-secondary">
                        <div class="row mb-2">
                            <div class="col">
                                <h4 class="text-center" id="job-title"></h4>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <h5 class="text-center" id="company-name"></h5>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row mb-2">
                    <div class="col ms-3 me-3 bg-secondary">
                        <h4 class="text-center" id="address"></h4>
                    </div>
                </div>
                <div class="row mb-2">
                    <div class="col me-2 ms-3 bg-secondary">
                        <h4 class="text-center" id="work-type"></h4>
                    </div>
                    <div class="col ms-2 me-3 bg-secondary">
                        <h4 class="text-center" id="employ-type"></h4>
                    </div>
                </div>
                <div class="row mb-2">
                    <div class="col me-2 ms-3 bg-secondary">
                        <h4 class="text-center" id="salary-range"></h4>
                    </div>
                    <div class="col ms-2 me-3 bg-secondary">
                        <h4 class="text-center" id="age-require"></h4>
                    </div>
                </div>
                <div class="row mb-2">
                    <div class="col me-2 ms-3 bg-secondary container">
                        <div class="row">
                            <div class="col">
                                <h4 class="text-center" id="">HOURS</h4>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <ul id="hours"></ul>
                            </div>
                        </div>
                    </div>
                    <div class="col ms-2 me-3 container bg-secondary">
                        <div class="row">
                            <div class="col">
                                <h4 class="text-center">SKILLS</h4>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <ul id="skills">
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row mb-2">
                    <div class="col container ms-3 me-3 bg-secondary">
                        <div class="row">
                            <div class="col">
                                <h4 class="text-center">Summary</h4>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <p class="text-start" id="short-summary"></p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row mb-3 justify-content-center">
                    <div class="col col-4 bg-secondary">
                        <h4 class="text-center clickable" data-bs-toggle="collapse" data-bs-target="#summary-box">More Info</h4>
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <p class="text-start text-light" id="date-posted"></p>
                    </div>
                    <div class="col">
                        <p class="text-end text-light" id="date-deadline"></p>
                    </div>
                </div>
            </div>
            <!-- Expanded summary -->
            <div class="col-4 container collapse" id="summary-box" style="background-color: #3da19e;">
                <div class="row">
                    <div class="col">
                        <h4 class="text-center">Description</h4>
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <p class="text-start" id="full-summary"></p>
                    </div>
                </div>
            </div>
        </div>
        <!-- Quick actions -->
        <div class="row" id="action-buttons">
            <div class="col container col-auto bg-teal">
                <div class="row justify-content-center m-2">
                    <div class="col me-2 col-auto bg-secondary">
                        <h4 class="text-center" id="apply-btn">Apply</h4>
                    </div>
                    <div class="col col-auto bg-secondary">
                        <h4 class="text-center" id="save-btn">Save</h4>
                    </div>
                    <div class="col ms-2 col-auto bg-secondary">
                        <h4 class="text-center" id="hide-btn">Hide</h4>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row d-none" id="none-left-header">
        <div class="col justify-content-center d-flex align-items-center">
            <h1>There are no more job posts to view.</h1>
        </div>
    </div>
    <!-- Scroll arrows -->
    <div class="position-absolute top-50 end-0 me-5 translate-middle-y d-flex flex-column gap-2">
        <button id="scroll-up-btn">↑</button>
        <button id="scroll-down-btn">↓</button>
    </div>

    <script src="bootstrap-5.3.8-dist/js/bootstrap.bundle.js"></script>
    <script src="logic/main.js"></script>
    <script src="logic/jobFetcher.js"></script>
</body>
</html>
