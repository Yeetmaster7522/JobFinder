<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finder</title>
    <link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="container">
        <div class="container">
        <!-- Top navigation bar -->
        <div class="row">
            <div class="col navbar"></div>
        </div>
        <!-- Search and filters -->
        <div class="row">
            <div class="col bg-success">
                <h4 class="text-center">X/X Job Posts</h4>
            </div>
            <div class="col bg-danger">
                <h4 class="text-center">Search</h4>
            </div>
            <div class="col bg-success">
                <h4 class="text-center">Filters</h4>
            </div>
        </div>
        <!-- Overview of job -->
        <div class="row">
            <div class="col container">
                <div class="row">
                    <div class="col container bg-info">
                        <div class="row">
                            <div class="col">
                                <h4 class="text-center">Job Title</h4>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <h4 class="text-center">Company name</h4>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row bg-success">
                    <div class="col">
                        <h4 class="text-center">Address</h4>
                    </div>
                </div>
                <div class="row">
                    <div class="col bg-primary">
                        <h4 class="text-center">Work Type</h4>
                    </div>
                    <div class="col bg-secondary">
                        <h4 class="text-center">Employment Type</h4>
                    </div>
                </div>
                <div class="row">
                    <div class="col bg-secondary">
                        <h4 class="text-center">Salary Range</h4>
                    </div>
                    <div class="col bg-primary">
                        <h4 class="text-center">Age Requirement</h4>
                    </div>
                </div>
                <div class="row">
                    <div class="col bg-primary">
                        <h4 class="text-center">Hours</h4>
                    </div>
                    <div class="col bg-secondary">
                        <h4 class="text-center">Skills</h4>
                    </div>
                </div>
                <div class="row">
                    <div class="col container bg-info">
                        <div class="row">
                            <div class="col">
                                <h4 class="text-center">Summary</h4>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <p class="text-start">XXXXXXXXXXXXX</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col bg-success">
                        <h4 class="text-center">More Info</h4>
                    </div>
                </div>
            </div>
            <!-- Expanded summary -->
            <div class="col bg-warning">
                <h4 class="text-center">Summary</h4>
            </div>
        </div>
        <!-- Quick actions -->
        <div class="row">
            <div class="col bg-danger">
                <h4 class="text-center">Apply</h4>
            </div>
            <div class="col bg-success">
                <h4 class="text-center">Save</h4>
            </div>
            <div class="col bg-danger">
                <h4 class="text-center">Hide</h4>
            </div>
        </div>
    </div>

    <script src="bootstrap-5.3.8-dist/js/bootstrap.min.js"></script>
    <script src="jobFetcher.js"></script>
    <script src="main.js"></script>
</body>
</html>
